<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">

<style>
:root{
  color-scheme: light;
  --sea:#d9edf6; --sand:#f4e8d0; --land:#1f5f8b; --warm:#e8833a; --jiang:#23756e; --brick:#a94f36;
  --ink:#17324a; --muted:#4f6b84; --card:#ffffff; --line:#b5d0e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#0e2535; --sand:#43392a; --land:#7fb8dc; --warm:#f2a062; --jiang:#6fd0c4; --brick:#e0906f;
    --ink:#e6eef5; --muted:#9db4c7; --card:#16324a; --line:#2a4d68;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sea:#0e2535; --sand:#43392a; --land:#7fb8dc; --warm:#f2a062; --jiang:#6fd0c4; --brick:#e0906f;
  --ink:#e6eef5; --muted:#9db4c7; --card:#16324a; --line:#2a4d68;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--sea); color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:24px 44px;
}
.wrap{max-width:980px;margin:0 auto;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--jiang);font-weight:700;margin:0}
.wave{display:block;width:100%;height:28px;margin:14px 0 0}
.motifs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.motifs li{font-size:13px;padding:4px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.motifs li:nth-child(1){border-color:var(--jiang)}
.motifs li:nth-child(2){border-color:var(--brick)}
.motifs li:nth-child(3){border-color:var(--warm)}
.motifs li:nth-child(4){border-color:var(--land)}
h1{font-family:"Noto Serif TC",serif;font-size:30px;margin:4px 0 6px;text-wrap:balance}
.sub{margin:0;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0 16px}
.stat{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--jiang);border-radius:14px;padding:14px 16px;min-width:0}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;color:var(--land);font-variant-numeric:tabular-nums}

.stage{
  position:relative; height:min(64vh,540px); min-height:360px;
  border-radius:18px; overflow:hidden; border:1px solid var(--line);
  background:var(--sea);
}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{
  position:absolute; left:0; top:0; transform:translate(-50%,-100%);
  background:var(--card); color:var(--ink); border:1px solid var(--line);
  border-radius:99px; padding:3px 11px; font-size:13px; white-space:nowrap;
  font-variant-numeric:tabular-nums; box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.tag b{color:var(--land)}
.tag.on{border-color:var(--warm);box-shadow:0 0 0 2px var(--warm)}
.tag.hub{font-weight:700}
.mode{
  position:absolute; top:12px; right:12px; z-index:2;
  font:inherit; font-size:13px; padding:6px 12px; border-radius:99px; cursor:pointer;
  background:var(--card); color:var(--ink); border:1px solid var(--line);
}
.mode[aria-pressed="true"]{border-color:var(--warm);box-shadow:0 0 0 2px var(--warm) inset}
.mode:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.times{position:absolute; top:12px; left:12px; z-index:2; display:flex; gap:6px}
.tbtn{
  font:inherit; font-size:13px; padding:6px 12px; border-radius:99px; cursor:pointer;
  background:var(--card); color:var(--ink); border:1px solid var(--line);
}
.tbtn[aria-pressed="true"]{border-color:var(--warm);box-shadow:0 0 0 2px var(--warm) inset}
.tbtn:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.sheet{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));
  background:rgba(8,20,30,.45);
}
.sheet[hidden]{display:none!important}
.sheet-box{position:relative;width:min(900px,100%);max-height:90vh;overflow:auto;border-radius:18px}
.sheet-box .detail{margin-top:0}
.close{
  position:absolute; top:12px; right:12px; z-index:1; width:36px; height:36px; border-radius:99px;
  border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; font-size:20px; line-height:1; cursor:pointer;
}
.close:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.views{position:absolute; right:12px; bottom:10px; z-index:2; display:flex; gap:6px}
.vbtn{
  font:inherit; font-size:13px; padding:6px 12px; border-radius:99px; cursor:pointer;
  background:var(--card); color:var(--ink); border:1px solid var(--line);
}
.vbtn[aria-pressed="true"]{border-color:var(--warm);box-shadow:0 0 0 2px var(--warm) inset}
.vbtn:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.gantt-scroll{grid-column:1 / -1;min-width:0}
.gantt{min-width:0}
.g-row{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:8px 0;border-bottom:1px dashed var(--line)}
.g-row.head{border-bottom:0;padding:0 0 4px}
.g-label{font-size:13px;min-width:0;overflow-wrap:anywhere}
.g-label small{display:block;color:var(--muted);font-size:12px}
.g-track{position:relative;height:22px;border-radius:6px;background:var(--sand);margin-top:2px}
.g-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.g-plan{position:absolute;left:0;top:4px;height:5px;border-radius:3px;background:var(--line)}
.g-act{position:absolute;top:10px;height:8px;border-radius:4px;background:var(--land)}
.g-act.doing{background:var(--warm)}
.g-act.stop{background:#9ca3af}
.g-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--warm);opacity:.85}
.g-phase{font-weight:700;color:var(--land);font-size:13px;margin-top:12px}
.g-legend{font-size:12px;color:var(--muted);margin-top:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.g-legend i{display:inline-block;width:16px;height:6px;border-radius:3px;vertical-align:middle;margin-right:4px}
.g-note{font-size:12px;color:var(--muted);margin:10px 0 0}
.hint{
  position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--muted);
  background:var(--card); padding:4px 10px; border-radius:99px; opacity:.92;
}
.fallback{padding:20px;margin:0}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.card{
  text-align:left; background:var(--card); color:var(--ink);
  border:1px solid var(--line); border-radius:14px; padding:14px;
  font:inherit; cursor:pointer; min-width:0;
}
.card[aria-pressed="true"]{border-color:var(--warm);box-shadow:0 0 0 2px var(--warm) inset}
.card:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.card .name{font-weight:700;margin:0 0 6px;overflow-wrap:anywhere}
.card .meta{font-size:13px;color:var(--muted);margin:0 0 10px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--sand);overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--land);border-radius:99px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--warm);color:#fff;margin-bottom:8px;font-weight:500}

.detail{
  margin-top:16px; background:var(--card); border:1px solid var(--line);
  border-radius:18px; padding:22px; display:grid; gap:18px;
  grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
}
.detail h2{font-family:"Noto Serif TC",serif;font-size:22px;margin:0 0 8px;text-wrap:balance}
.detail .note{margin:0 0 14px}
.detail .big{font-size:40px;font-weight:700;color:var(--land);font-variant-numeric:tabular-nums;line-height:1}
.detail .small{font-size:13px;color:var(--muted);margin:6px 0 10px}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding-left:14px;border-left:3px solid var(--line);min-width:0}
.timeline li.past{border-left-color:var(--warm)}
.timeline .d{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.timeline .t{overflow-wrap:anywhere}
.timeline .tag2{grid-column:2;font-size:12px;color:var(--muted)}
.timeline li.past .tag2{color:var(--warm);font-weight:500}

.foot{margin-top:16px;font-size:13px;color:var(--muted)}
.foot a{color:var(--land)}

@media (max-width:760px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail{grid-template-columns:minmax(0,1fr)}
  h1{font-size:24px}
  .stat .v{font-size:20px}
}
@media (max-width:420px){ .cards{grid-template-columns:minmax(0,1fr)} }
</style>

</div>

// Gantt chart for one project: each task on a shared timeline, plan (thin) vs actual (bar)
const STATUS_LABEL = { done:"已完成", doing:"進行中", stop:"流標", todo:"未開始", na:"不適用" };
function fmtDate(ms){
  const d = new Date(ms);
  return d.getUTCFullYear() + "/" + String(d.getUTCMonth() + 1).padStart(2, "0") + "/" + String(d.getUTCDate()).padStart(2, "0");
}
function ganttHTML(idx){
  if (idx < 0) return "";
  const list = TASKS[idx];
  const ms = d => Date.parse(d + "T00:00:00Z");
  const dates = list.flatMap(t => [t[3], t[4], t[5], t[6]]).filter(Boolean).map(ms);
  if (!dates.length) return "";
  const T0 = Math.min(...dates), T1 = Math.max(...dates, ms(TODAY));
  const pos = d => ((ms(d) - T0) / (T1 - T0)) * 100;
  const todayLeft = ((ms(TODAY) - T0) / (T1 - T0)) * 100;
  let html = `<div class="gantt">
    <div class="g-row head"><div></div><div class="g-axis"><span>${fmtDate(T0)}</span><span>${fmtDate(T1)}</span></div></div>`;
  let lastPhase = "";
  list.forEach(([phase, name, owner, ps, pe, as, ae, st]) => {
    if (phase !== lastPhase){ html += `<div class="g-phase">${phase}</div>`; lastPhase = phase; }
    let bars = "";
    if (ps && pe){
      const l = pos(ps), w = Math.max(0.8, pos(pe) - l);
      bars += `<div class="g-plan" style="left:${l}%;width:${w}%"></div>`;
    }
    if (as){
      const l = pos(as), end = ae || TODAY, w = Math.max(0.8, pos(end) - l);
      const cls = st === "doing" ? "doing" : st === "stop" ? "stop" : "";
      bars += `<div class="g-act ${cls}" style="left:${l}%;width:${w}%"></div>`;
    }
    const plan = ps ? `${ps.replace(/-/g, "/")}～${pe.replace(/-/g, "/")}` : "";
    const actual = as ? `　實際 ${as.replace(/-/g, "/")}${ae ? "～" + ae.replace(/-/g, "/") : "～"}` : "";
    html += `<div class="g-row">
      <div class="g-label">${name}<small>${owner}・${STATUS_LABEL[st]}</small><small>${plan}${actual}</small></div>
      <div class="g-track">${bars}<div class="g-today" style="left:${todayLeft}%"></div></div>
    </div>`;
  });
  const legend = `<div class="g-legend">
      <span><i style="background:var(--line)"></i>預定</span>
      <span><i style="background:var(--land)"></i>實際（已完成）</span>
      <span><i style="background:var(--warm)"></i>實際（進行中）</span>
      <span><i style="background:#9ca3af"></i>流標</span>
      <span><i style="background:var(--warm);width:2px;height:12px"></i>今日 ${TODAY.replace(/-/g, "/")}</span>
    </div>
    <p class="g-note">資料依試算表「(1150907修)」工作表整理，為匯出時的快照；未經同步，請以原始試算表為準。</p>`;
  return legend + html + "</div>";
}

function init3D(){
  const dark = document.documentElement.dataset.theme === "dark" ||
    (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  const P = dark
    ? { sky:0x0e2535, sea:0x1f5a7d, sand:0xb8a374, land:0x7fb8dc, hub:0x5fb89f, warm:0xf2a062,
        bridge:0xd8c9a0, bld:0xe6eef5, pole:0xdfe6ea, blue:0x6aa6e0, roof:0xb0704f, door:0x6b5440,
        grass:0x4e8f55, leaf:0x6fbf7a, trunk:0x7a5230, play:0xf2c14e, track:0xc0714b }
    : { sky:0xd9edf6, sea:0x2a8c9e, sand:0xf2e2b8, land:0x1f5f8b, hub:0x23756e, warm:0xe8833a,
        bridge:0xc9b07a, bld:0xffffff, pole:0x8fa3b0, blue:0x2f6fb0, roof:0xa94f36, door:0x5b4636,
        grass:0x6fb36a, leaf:0x4f9a5a, trunk:0x7a5230, play:0xf2c14e, track:0xd9825b };

  const ASPHALT = dark ? 0x4b5563 : 0x8b96a3;
  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(P.sky);
  scene.fog = new THREE.Fog(P.sky, 500, 1200);

  const camera = new THREE.PerspectiveCamera(40, 1, 1, 2500);
  const sph = { theta:0.5, phi:0.95, r:520, rTarget:520 };
  const target = new THREE.Vector3(0, 8, 0);
  const desired = new THREE.Vector3(0, 8, 0);

  const ambient = new THREE.AmbientLight(0xffffff, 0.65);
  scene.add(ambient);
  const allLamps = [];
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(200, 400, 150);
  scene.add(sun);

  // sea
  const seaGeo = new THREE.PlaneGeometry(1600, 1600, 80, 80);
  const sea = new THREE.Mesh(seaGeo, new THREE.MeshStandardMaterial({
    color:P.sea, roughness:0.35, metalness:0.05, flatShading:true
  }));
  sea.rotation.x = -Math.PI / 2;
  scene.add(sea);

  // stars for the night sky
  const starPts = [];
  for (let i = 0; i < 420; i++){
    starPts.push((Math.random() - 0.5) * 2400, 180 + Math.random() * 900, (Math.random() - 0.5) * 2400);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPts, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    color:0xffffff, size:2, sizeAttenuation:false, fog:false
  }));
  stars.visible = false;
  scene.add(stars);

  // three sky presets: 黑夜 (night), 下午 (afternoon), 白天 (day)
  const SKIES = {
    day:       { sky:0xd9edf6, sea:P.sea,    sun:0xffffff, sunI:0.85, sunPos:[200,400,150],   amb:0.65 },
    afternoon: { sky:0xf3c9a0, sea:0x3d7f9a, sun:0xffd08a, sunI:1.00, sunPos:[320,170,140],   amb:0.55 },
    night:     { sky:0x0a1a2a, sea:0x163a55, sun:0x9ab7d9, sunI:0.35, sunPos:[-200,300,-150], amb:0.35 }
  };
  const skyButtons = [...document.querySelectorAll(".tbtn[data-sky]")];
  function applySky(name){
    const S = SKIES[name];
    scene.background.setHex(S.sky);
    scene.fog.color.setHex(S.sky);
    sea.material.color.setHex(S.sea);
    sun.color.setHex(S.sun);
    sun.intensity = S.sunI;
    sun.position.set(...S.sunPos);
    ambient.intensity = S.amb;
    stars.visible = name === "night";
    allLamps.forEach(l => { l.bulbMat.emissiveIntensity = name === "night" ? 1.6 : 0; l.glowMat.opacity = name === "night" ? 0.9 : 0; });
    skyButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sky === name)));
  }
  skyButtons.forEach(b => b.addEventListener("click", () => applySky(b.dataset.sky)));
  applySky("day");

  /* --- small helpers for props (decorations are drawn SZ times larger) --- */
  const SZ = 1.45;
  let CUR_TOP = 0;
  const Y = y => CUR_TOP + (y - CUR_TOP) * SZ;
  const mat = c => new THREE.MeshStandardMaterial({ color:c, roughness:0.7 });
  function boxRaw(g, w, h, d, c, x, y, z, rz = 0, ry = 0){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
    m.position.set(x, y, z); m.rotation.set(0, ry, rz);
    g.add(m); return m;
  }
  function cylRaw(g, rt, rb, h, c, x, y, z, seg = 10){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(c));
    m.position.set(x, y, z); g.add(m); return m;
  }
  function boxIn(g, w, h, d, c, x, y, z, rz = 0, ry = 0){
    return boxRaw(g, w * SZ, h * SZ, d * SZ, c, x * SZ, Y(y), z * SZ, rz, ry);
  }
  function cylIn(g, rt, rb, h, c, x, y, z, seg = 10){
    return cylRaw(g, rt * SZ, rb * SZ, h * SZ, c, x * SZ, Y(y), z * SZ, seg);
  }
  function tree(g, x, z, y, s = 1){
    cylIn(g, 1 * s, 1.3 * s, 7 * s, P.trunk, x, y + 3.5 * s, z, 6);
    const crown = new THREE.Mesh(new THREE.SphereGeometry(6 * s * SZ, 10, 8), mat(P.leaf));
    crown.position.set(x * SZ, Y(y + 9 * s), z * SZ);
    g.add(crown);
  }
  // soft glow sprite for the street lamps
  const glowCanvas = document.createElement("canvas");
  glowCanvas.width = glowCanvas.height = 64;
  const gctx = glowCanvas.getContext("2d");
  const grad = gctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(255,236,170,1)");
  grad.addColorStop(0.35, "rgba(255,206,120,0.45)");
  grad.addColorStop(1, "rgba(255,206,120,0)");
  gctx.fillStyle = grad;
  gctx.fillRect(0, 0, 64, 64);
  const glowTex = new THREE.CanvasTexture(glowCanvas);
  function addLamp(g, x, z, top, lamps){
    cylIn(g, 0.4, 0.5, 11, P.pole, x, top + 5.5, z, 6);
    const bulbMat = new THREE.MeshStandardMaterial({ color:0xfff3c4, emissive:0xffd77a, emissiveIntensity:0 });
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(1.4 * SZ, 8, 6), bulbMat);
    bulb.position.set(x * SZ, Y(top + 11.2), z * SZ);
    g.add(bulb);
    const glowMat = new THREE.SpriteMaterial({ map:glowTex, color:0xffd77a, blending:THREE.AdditiveBlending, transparent:true, opacity:0, depthWrite:false });
    const glow = new THREE.Sprite(glowMat);
    glow.scale.set(14 * SZ, 14 * SZ, 1);
    glow.position.set(x * SZ, Y(top + 11.2), z * SZ);
    g.add(glow);
    lamps.push({ bulbMat, glowMat });
  }

  /* --- scenery: flowers, grass, benches, trees, cars --- */
  function rng(seed){ let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  function clampIn(x, z, lim){ const d = Math.hypot(x, z); const k = d > lim ? lim / d : 1; return [x * k, z * k]; }
  function flower(g, x, z, y, c){
    cylIn(g, 0.3, 0.3, 3.5, P.leaf, x, y + 1.75, z, 4);
    const f = new THREE.Mesh(new THREE.SphereGeometry(1.8 * SZ, 8, 6), mat(c));
    f.position.set(x * SZ, Y(y + 3.9), z * SZ); g.add(f);
  }
  function grassTuft(g, x, z, y){
    const m = new THREE.Mesh(new THREE.ConeGeometry(1.8 * SZ, 4 * SZ, 5), mat(P.grass));
    m.position.set(x * SZ, Y(y + 2), z * SZ); g.add(m);
  }
  function bench(g, x, z, y, ry){
    boxIn(g, 6, 0.8, 2, P.roof, x, y + 2.4, z, 0, ry);
    boxIn(g, 0.6, 2.4, 2, P.pole, x - 2.4 * Math.cos(ry), y + 1.2, z + 2.4 * Math.sin(ry), 0, ry);
    boxIn(g, 0.6, 2.4, 2, P.pole, x + 2.4 * Math.cos(ry), y + 1.2, z - 2.4 * Math.sin(ry), 0, ry);
  }
  function makeCar(color){
    const c = new THREE.Group();
    boxRaw(c, 6, 2.2, 3.2, color, 0, 0, 0);
    boxRaw(c, 3.2, 1.8, 2.8, 0xdbeafe, -0.3, 2, 0);
    return c;
  }
  function scatterDecor(g, R, top, seed, lamps){
    const rnd = rng(seed * 31 + 7);
    const palette = [0xf472b6, 0xfacc15, 0xffffff, 0xa78bfa, 0xfb923c];
    for (let k = 0; k < 5; k++){
      const a = k * (Math.PI * 2 / 5) + rnd() * 0.6;
      const d = R * (0.4 + rnd() * 0.1);
      tree(g, Math.cos(a) * d, Math.sin(a) * d, top, 0.6 + rnd() * 0.4);
    }
    for (let c = 0; c < 4; c++){
      const [cx, cz] = clampIn((rnd() - 0.5) * R * 1.0, (rnd() - 0.5) * R * 1.0, R * 0.5);
      for (let j = 0; j < 6; j++){
        const [x, z] = clampIn(cx + (rnd() - 0.5) * 9, cz + (rnd() - 0.5) * 9, R * 0.6);
        flower(g, x, z, top, palette[Math.floor(rnd() * palette.length)]);
      }
    }
    for (let j = 0; j < 14; j++){
      const [x, z] = clampIn((rnd() - 0.5) * R * 1.2, (rnd() - 0.5) * R * 1.2, R * 0.62);
      grassTuft(g, x, z, top);
    }
    for (let b = 0; b < 2; b++){
      const a = rnd() * Math.PI * 2;
      bench(g, Math.cos(a) * R * 0.4, Math.sin(a) * R * 0.4, top, a);
    }
    // four street lamps around each island
    for (let k = 0; k < 4; k++){
      const a = k * Math.PI / 2 + 0.4;
      addLamp(g, Math.cos(a) * R * 0.55, Math.sin(a) * R * 0.55, top, lamps);
    }
  }

  /* --- island base: sand + land column (height = progress) + warm waterline --- */
  function makeIsland(r, pct, landColor){
    const group = new THREE.Group();
    const H = 4 + (pct / 100) * 40;

    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(r, r * 1.06, 12, 8),
      new THREE.MeshStandardMaterial({ color:P.sand, roughness:0.9 })
    );
    base.rotation.y = Math.PI / 8;
    group.add(base);

    const land = new THREE.Mesh(
      new THREE.CylinderGeometry(r * 0.9, r * 0.96, H, 8),
      new THREE.MeshStandardMaterial({ color:landColor, roughness:0.6 })
    );
    land.rotation.y = Math.PI / 8;
    land.position.y = 6 + H / 2;
    group.add(land);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(r * 0.9, 1.1, 6, 24),
      new THREE.MeshStandardMaterial({ color:P.warm, emissive:P.warm, emissiveIntensity:0.25 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 6 + H;
    group.add(ring);

    return { group, base, land, top: 6 + H };
  }

  /* --- facilities, one builder per island, matched to the project --- */
  function buildRamp(g, y){
    const box = (...a) => boxIn(g, ...a);
    const cyl = (...a) => cylIn(g, ...a);
    // accessible ramp leading up to an entrance
    box(30, 2, 12, P.bridge, -4, y + 2.5, 0, -0.22);
    box(18, 12, 16, P.bld, 16, y + 6, 0);
    box(18, 1.2, 18, P.roof, 16, y + 12.6, 0);
    box(4, 8, 0.6, P.door, 16, y + 4, 8.3);
    // handrails along the ramp
    box(28, 0.8, 0.8, P.warm, -4, y + 7, -6.5, -0.22);
    box(28, 0.8, 0.8, P.warm, -4, y + 7, 6.5, -0.22);
    // accessibility sign on a pole
    box(1, 12, 1, P.pole, -24, y + 6, -12);
    box(8, 8, 1, P.blue, -24, y + 14, -12);
    tree(g, -18, 16, y, 0.8);
    tree(g, 16, -18, y, 0.7);
  }
  function buildRestroom(g, y){
    const box = (...a) => boxIn(g, ...a);
    const cyl = (...a) => cylIn(g, ...a);
    // restroom block with a neutral, all-gender sign
    box(24, 14, 18, P.bld, 0, y + 7, 0);
    box(28, 2, 22, P.roof, 0, y + 15, 0);
    box(5, 8, 0.6, P.door, 0, y + 4, 9.3);
    cyl(4, 4, 1, P.blue, 0, y + 11, 9.6, 16).rotation.x = Math.PI / 2;
    box(1, 9, 1, P.pole, 16, y + 4.5, 12);
    box(3, 4, 0.5, P.warm, 16, y + 9, 12.6);
    tree(g, -20, 14, y, 0.8);
    tree(g, 20, -12, y, 0.7);
  }
  function buildTrack(g, y){
    const box = (...a) => boxIn(g, ...a);
    const cyl = (...a) => cylIn(g, ...a);
    // oval track with a grass field inside, goal posts, and bleachers
    const ring = new THREE.Mesh(new THREE.TorusGeometry(22, 3.5, 8, 48), mat(P.track));
    ring.rotation.x = Math.PI / 2;
    ring.scale.set(1, 0.6, 1);
    ring.position.y = y + 1.5;
    g.add(ring);
    box(34, 0.8, 12, P.grass, 0, y + 0.4, 0);
    // goal posts at each end of the field
    [-16, 16].forEach(x => {
      box(1, 9, 1, P.pole, x, y + 5, 0);
      box(1, 1, 8, P.pole, x, y + 9.5, 0);
    });
    // bleachers on the outside, stepped
    for (let s = 0; s < 3; s++){
      box(22, 2, 4, P.bld, 0, y + 1 + s * 2, 22 + (2 - s) * 4 * 0.9 - 6);
    }
    tree(g, -26, -14, y, 0.7);
    tree(g, 26, 10, y, 0.8);
  }
  function buildPlay(g, y){
    const box = (...a) => boxIn(g, ...a);
    const cyl = (...a) => cylIn(g, ...a);
    // climbing dome, slide, swing frame, seesaw
    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(8, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat(P.play)
    );
    dome.position.set(-8, y, -4);
    g.add(dome);
    box(15, 1.2, 4, P.play, 8, y + 6, 6, 0.5);
    box(1.2, 11, 1.2, P.pole, 14, y + 5.5, 6);
    // swing frame
    box(22, 1.2, 1.2, P.pole, 6, y + 12, -18);
    box(1.2, 12, 1.2, P.pole, -5, y + 6, -18);
    box(1.2, 12, 1.2, P.pole, 17, y + 6, -18);
    box(5, 0.8, 2, P.warm, 2, y + 6, -18);
    box(5, 0.8, 2, P.warm, 10, y + 6, -18);
    // seesaw
    box(12, 1, 2.5, P.warm, -6, y + 3, 14, 0.25);
    cyl(2, 2.2, 3, P.pole, -6, y + 1.5, 14, 4);
    tree(g, -18, -14, y, 0.8);
    tree(g, 20, 6, y, 0.7);
  }
  const builders = { ramp:buildRamp, restroom:buildRestroom, track:buildTrack, play:buildPlay };

  // hub island with a headquarters building, flagpole and trees
  const hubIsle = makeIsland(hub.r, hub.pct, P.hub);
  hubIsle.group.position.set(hub.pos[0], 0, hub.pos[1]);
  const hy = hubIsle.top;
  CUR_TOP = hy;
  boxIn(hubIsle.group, 26, 22, 22, P.bld, 0, hy + 11, 0);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(18, 10, 4), mat(P.roof));
  roof.rotation.y = Math.PI / 4;
  roof.scale.setScalar(SZ);
  roof.position.set(0, Y(hy + 27), 0);
  hubIsle.group.add(roof);
  boxIn(hubIsle.group, 0.8, 20, 0.8, P.pole, -20, hy + 10, -16);
  boxIn(hubIsle.group, 7, 4, 0.3, P.warm, -16, hy + 18, -16);
  tree(hubIsle.group, -26, 6, hy, 1);
  tree(hubIsle.group, 26, -6, hy, 0.9);
  tree(hubIsle.group, 12, 30, hy, 0.8);
  scatterDecor(hubIsle.group, hub.r, hy, 0, allLamps);
  boxIn(hubIsle.group, 20, 12, 14, P.bld, -20, hy + 6, -14);
  boxIn(hubIsle.group, 22, 1.5, 16, P.roof, -20, hy + 12.7, -14);
  boxIn(hubIsle.group, 26, 0.8, 14, ASPHALT, 20, hy + 0.4, 14);
  [[14, 0xef4444], [20, 0x10b981], [26, 0xf8fafc]].forEach(([x, col]) => {
    const pc = makeCar(col);
    pc.scale.setScalar(SZ);
    pc.position.set(x * SZ, hy + 1.9 * SZ, 14 * SZ);
    hubIsle.group.add(pc);
  });
  for (let k = 0; k < 6; k++){
    const a = k * Math.PI / 3 + 0.2;
    addLamp(hubIsle.group, Math.cos(a) * 36, Math.sin(a) * 36, hy, allLamps);
  }
  bench(hubIsle.group, -12, 40, hy, 0);
  bench(hubIsle.group, 12, 40, hy, 0);
  hubIsle.base.userData.index = -1;
  hubIsle.land.userData.index = -1;
  scene.add(hubIsle.group);

  const bridges = [];
  // a small flock of black-faced spoonbills (黑面琵鷺) circling the hub
  const spoonbills = [];
  for (let i = 0; i < 3; i++) {
    const bird = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(2.2, 12, 10),
      new THREE.MeshStandardMaterial({ color:0xf7f3ea, roughness:0.6 }));
    body.scale.set(1.6, 0.9, 1);
    const beak = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.5, 0.5),
      new THREE.MeshStandardMaterial({ color:0x1b1f27, roughness:0.5 }));
    beak.position.set(3.4, -0.3, 0);
    bird.add(body, beak);
    bird.scale.setScalar(SZ);
    scene.add(bird);
    spoonbills.push({ bird, off:i * 2.1, rad:82 + i * 6 });
  }

  // four satellite islands with their facilities, plus bridges to the hub
  const isles = projects.map((p, i) => {
    const o = makeIsland(p.r, p.pct, P.land);
    o.group.position.set(p.pos[0], 0, p.pos[1]);
    o.base.userData.index = i;
    o.land.userData.index = i;
    CUR_TOP = o.top;
    builders[p.kind](o.group, o.top);
    scatterDecor(o.group, p.r, o.top, i + 1, allLamps);
    scene.add(o.group);

    // bridge from hub edge to island edge
    const dx = p.pos[0] - hub.pos[0], dz = p.pos[1] - hub.pos[1];
    const dist = Math.hypot(dx, dz);
    const ux = dx / dist, uz = dz / dist;
    const start = hub.r * 0.9, end = dist - p.r * 0.9;
    const len = end - start;
    const bridge = new THREE.Mesh(
      new THREE.BoxGeometry(len, 3, 12),
      new THREE.MeshStandardMaterial({ color:P.bridge, roughness:0.8 })
    );
    const mx = hub.pos[0] + ux * (start + len / 2);
    const mz = hub.pos[1] + uz * (start + len / 2);
    bridge.position.set(mx, 5, mz);
    bridge.rotation.y = -Math.atan2(dz, dx);
    scene.add(bridge);
    bridges.push({
      ax: hub.pos[0] + ux * start, az: hub.pos[1] + uz * start,
      bx: hub.pos[0] + ux * end,   bz: hub.pos[1] + uz * end
    });

    const tag = document.createElement("div");
    tag.className = "tag";
    tag.innerHTML = `${p.short} <b>${p.pct.toFixed(1)}%</b>`;
    labelsEl.appendChild(tag);

    return { o, tag, x:p.pos[0], z:p.pos[1], top:o.top };
  });

  const movers = [];
  bridges.forEach(br => {
    [[0, 1, 0x3b82f6], [0.5, -1, 0xf59e0b]].forEach(([s0, dir, col]) => {
      const car = makeCar(col);
      car.scale.setScalar(1.5);
      scene.add(car);
      movers.push({ car, br, s0, dir, speed:0.05 });
    });
  });

  const hubTag = document.createElement("div");
  hubTag.className = "tag hub";
  hubTag.innerHTML = `總務處 <b>${hub.pct.toFixed(1)}%</b>`;
  labelsEl.appendChild(hubTag);

  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    sph.r = w / h < 1 ? 720 : 520;
    sph.rTarget = sph.r;
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // interaction: drag to orbit, wheel to zoom, click to select
  const canvas = renderer.domElement;
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let down = null, dragging = false;

  const modeBtn = document.getElementById("modeBtn");
  let panMode = false;
  modeBtn.addEventListener("click", () => {
    panMode = !panMode;
    modeBtn.setAttribute("aria-pressed", String(panMode));
    modeBtn.textContent = panMode ? "平移中（點此切回旋轉）" : "平移模式";
    canvas.style.cursor = panMode ? "move" : "";
  });
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  const PAN_LIMIT = 350;
  canvas.addEventListener("pointerdown", e => {
    const pan = panMode || e.button === 2 || e.shiftKey;
    down = { x:e.clientX, y:e.clientY, th:sph.theta, ph:sph.phi, pan, origin:desired.clone() };
    dragging = false;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.hypot(dx, dy) > 5) dragging = true;
    if (!dragging) return;
    if (down.pan){
      // slide the focus point across the sea, in the direction the camera is facing
      const k = sph.r * 0.0015;
      const th = sph.theta;
      const right = new THREE.Vector3(Math.cos(th), 0, -Math.sin(th));
      const fwd = new THREE.Vector3(-Math.sin(th), 0, -Math.cos(th));
      const p = down.origin.clone().addScaledVector(right, -dx * k).addScaledVector(fwd, dy * k);
      p.x = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, p.x));
      p.z = Math.max(-PAN_LIMIT, Math.min(PAN_LIMIT, p.z));
      p.y = 8;
      desired.copy(p);
      target.copy(p);
    } else {
      sph.theta = down.th - dx * 0.008;
      if (viewMode === "free") sph.phi = Math.min(1.4, Math.max(0.08, down.ph - dy * 0.005));
    }
  });
  canvas.addEventListener("pointerup", e => {
    if (down && !dragging){
      const rect = canvas.getBoundingClientRect();
      ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      ray.setFromCamera(ndc, camera);
      const meshes = [hubIsle.base, hubIsle.land, ...isles.map(s => s.o.base), ...isles.map(s => s.o.land)];
      const hits = ray.intersectObjects(meshes, false);
      if (hits.length) select(hits[0].object.userData.index);
    }
    down = null;
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    sph.r = Math.min(900, Math.max(300, sph.r + e.deltaY * 0.4));
    sph.rTarget = sph.r;
  }, { passive:false });

  window.focusIsland = i => {
    if (i < 0) desired.set(hub.pos[0], 8, hub.pos[1]);
    else desired.set(projects[i].pos[0], 8, projects[i].pos[1]);
  };
  window.focusIsland(active);

  // view presets: 自由旋轉 (free), 鳥瞰 (bird's eye), 俯視 (top-down)
  let viewMode = "free";
  const viewButtons = [...document.querySelectorAll(".vbtn")];
  function setView(m){
    viewMode = m;
    viewButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === m)));
    const base = stage.clientWidth / stage.clientHeight < 1 ? 720 : 520;
    if (m === "top") sph.rTarget = base + 60;
    if (m === "bird") sph.rTarget = base - 80;
  }
  viewButtons.forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));

  const seaPos = seaGeo.attributes.position;
  const v = new THREE.Vector3();

  function frame(now){
    const t = now * 0.001;

    const amp = reduceMotion ? 0.8 : 2.2;
    for (let i = 0; i < seaPos.count; i++){
      const x = seaPos.getX(i), y = seaPos.getY(i);
      seaPos.setZ(i, Math.sin(x * 0.016 + t * 0.9) * amp + Math.cos(y * 0.02 + t * 0.7) * amp);
    }
    seaPos.needsUpdate = true;

    if (viewMode !== "free"){
      const goal = viewMode === "top" ? 0.08 : 0.7;
      sph.phi += (goal - sph.phi) * 0.08;
      sph.r += (sph.rTarget - sph.r) * 0.08;
    }
    target.lerp(desired, 0.08);
    camera.position.set(
      target.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
      target.y + sph.r * Math.cos(sph.phi),
      target.z + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
    );
    camera.lookAt(target);

    // gentle bob on the selected island
    const bob = reduceMotion ? 0 : Math.sin(t * 2) * 1.2;
    hubIsle.group.position.y = active < 0 ? bob : 0;
    isles.forEach((s, i) => { s.o.group.position.y = i === active ? bob : 0; });

    // labels follow the islands on screen
    const placeTag = (tag, x, y, z, on) => {
      v.set(x, y, z).project(camera);
      tag.style.display = v.z < 1 ? "" : "none";
      tag.style.left = ((v.x + 1) / 2 * stage.clientWidth) + "px";
      tag.style.top = ((-v.y + 1) / 2 * stage.clientHeight) + "px";
      tag.classList.toggle("on", on);
    };
    placeTag(hubTag, hub.pos[0], hubIsle.top + hubIsle.group.position.y + 40, hub.pos[1], active < 0);
    isles.forEach((s, i) => {
      placeTag(s.tag, s.x, s.top + s.o.group.position.y + 16, s.z, i === active);
    });

    movers.forEach(m => {
      const s = (((m.s0 + t * m.speed) % 1) + 1) % 1;
      const u = m.dir > 0 ? s : 1 - s;
      const b = m.br;
      m.car.position.set(b.ax + (b.bx - b.ax) * u, 8.15, b.az + (b.bz - b.az) * u);
      m.car.rotation.y = Math.atan2(-(b.bz - b.az) * m.dir, (b.bx - b.ax) * m.dir);
    });

    spoonbills.forEach(sb => {
      const a = t * 0.22 + sb.off;
      sb.bird.position.set(
        hub.pos[0] + Math.cos(a) * sb.rad,
        Y(hubIsle.top) + 52 + Math.sin(t * 1.5 + sb.off) * 3,
        hub.pos[1] + Math.sin(a) * sb.rad
      );
      sb.bird.rotation.y = -a - Math.PI / 2;
    });

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
